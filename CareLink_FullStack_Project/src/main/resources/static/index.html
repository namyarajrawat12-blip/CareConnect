<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareLink Hospital Management</title>
<style>
:root{--navy:#142b4a;--teal:#168b84;--bg:#f3f6fa;--ink:#1d2a3a;--muted:#718096;--line:#e3eaf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--teal);color:#fff;font-weight:650}.secondary{background:#e9eff5;color:var(--navy)}.danger{background:#ffeded;color:#b43d3d}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#142b4a,#1b716e);padding:20px}.loginbox,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px}.loginbox{width:min(430px,100%);padding:32px}.loginbox form{display:grid;gap:13px;margin-top:20px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:650;color:#52647a}.field input,.field select,.field textarea{border:1px solid #dbe4ed;border-radius:8px;padding:10px;background:white}.demo,.notice{font-size:12px;line-height:1.7;background:#edf7ff;padding:12px;border-radius:9px;margin-top:15px}.layout{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{background:var(--navy);padding:20px 13px;color:white;display:flex;flex-direction:column;gap:7px}.brand{font-size:21px;font-weight:850;padding:8px}.tagline{font-size:10px;letter-spacing:2px;color:#b8c9dc;padding:0 8px 18px}.nav{background:transparent;text-align:left;color:#d7e3f0}.nav.active,.nav:hover{background:#284565;color:#fff}.sidefoot{margin-top:auto;font-size:12px;color:#c4d1df;padding:8px}.main{min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.topbar h1{font-size:20px}.status{font-size:12px;color:var(--teal)}.content{padding:25px;max-width:1400px;margin:auto}.welcome{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}.welcome h2{margin:0 0 6px;font-size:26px}.muted{font-size:13px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.metric{font-size:30px;font-weight:800;margin:10px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:11px;border-bottom:1px solid #edf1f6;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:#6d7d90;background:#f7f9fc}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;bottom:20px;right:20px;padding:12px 16px;background:#173b58;color:white;border-radius:9px;z-index:20}.error{color:#a52d2d;background:#fff0f0;padding:12px;border-radius:8px}.pill{background:#e8f7f4;color:#15786f;border-radius:18px;padding:4px 8px;font-size:11px}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,1fr)}.brand,.tagline,.sidefoot{grid-column:1/-1}.cards{grid-template-columns:1fr 1fr}.content{padding:14px}}@media(max-width:500px){.formgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.welcome{align-items:start;flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div style="color:#168b84;font-weight:850;letter-spacing:2px">✚ CARELINK</div><h1>Welcome back</h1><p class="muted">Hospital management, connected.</p><form id="loginForm"><div class="field"><label>ROLE</label><select id="role"><option value="admin">Hospital Admin</option><option value="doctor">Doctor</option><option value="patient">Patient</option></select></div><div class="field"><label>EMAIL</label><input id="email" type="email" value="admin@carelink.in" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" value="admin123" required></div><button>Sign in →</button></form><div class="demo">Demo accounts<br>Admin: admin@carelink.in / admin123<br>Doctor: doctor@carelink.in / doctor123<br>Patient: patient@carelink.in / patient123<br><b>Educational prototype only.</b></div></div></div>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="brand">✚ CARELINK</div><div class="tagline">HOSPITAL MANAGEMENT</div><button class="nav active" data-page="Dashboard">▦ Dashboard</button><button class="nav" data-page="Patients">♙ Patients</button><button class="nav" data-page="Doctors">✚ Doctors</button><button class="nav" data-page="Appointments">▣ Appointments</button><button class="nav" data-page="Records">▤ Medical records</button><button class="nav" data-page="Medicines">⚕ Pharmacy</button><button class="nav" data-page="Admissions">▦ Admissions</button><button class="nav" data-page="Bills">＄ Billing</button><button class="nav" data-page="Consents">⇄ Record sharing</button><button class="nav" data-page="Audit">◷ Audit log</button><div class="sidefoot"><span id="who">Demo user</span><br><button class="secondary" id="logout" style="margin-top:10px">Sign out</button></div></aside><main class="main"><header class="topbar"><h1 id="title">Dashboard</h1><span class="status" id="apiStatus">● API check</span></header><div class="content" id="content"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let user=null,page='Dashboard';const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=x=>x?String(x).replace('T',' ').replace('.0',''):'—';
async function api(path,opt={}){let r=await fetch('/api'+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok){let m='Request failed '+r.status;try{let j=await r.json();m=j.message||j.error||m}catch{}throw Error(m)}return r.status===204?null:r.json()}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2800)}
function tbl(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}">No records yet.</td></tr>`}</tbody></table></div>`}
function tr(vals){return `<tr>${vals.map(x=>`<td>${x}</td>`).join('')}</tr>`}
function field(label,name,type='text',required=false){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${required?'required':''}></div>`}
function formModal(title,fields,save){let m=document.createElement('div');m.style='position:fixed;inset:0;background:#142b4a88;display:grid;place-items:center;padding:15px;z-index:10';m.innerHTML=`<section class="panel" style="width:min(650px,100%);max-height:90vh;overflow:auto"><div class="panelhead"><h3>${title}</h3><button type="button" class="secondary close">Close</button></div><form><div class="formgrid">${fields}</div><div style="display:flex;justify-content:end;gap:8px;margin-top:15px"><button type="button" class="secondary close">Cancel</button><button>Save</button></div></form></section>`;document.body.append(m);m.querySelectorAll('.close').forEach(b=>b.onclick=()=>m.remove());m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await save(Object.fromEntries(new FormData(e.target).entries()));m.remove();toast('Saved');render()}catch(err){toast(err.message)}}}
function box(title,body,button=''){return `<section class="panel" style="margin-bottom:17px"><div class="panelhead"><h3>${title}</h3>${button}</div>${body}</section>`}
async function render(){page=$('.nav.active')?.dataset.page||page;$('#title').textContent=page;$('#content').innerHTML='<section class="panel">Loading data from Java and MySQL…</section>';try{
if(page==='Dashboard'){let d=await api('/dashboard');$('#content').innerHTML=`<div class="welcome"><div><h2>Hello, ${esc(user.name)} 👋</h2><div class="muted">Hospital overview from your database</div></div><span class="muted">${new Date().toLocaleDateString()}</span></div><div class="cards">${[['Patients',d.patients],['Doctors',d.doctors],['Appointments',d.appointments],['Medical records',d.records],['Bills',d.bills],['Active consents',d.consents]].map(x=>`<section class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></section>`).join('')}</div>${box('Project modules',`<p class="muted">Patient registration, appointment scheduling, clinical records, pharmacy, admissions, billing, consent tracking and audit history.</p><div class="notice">Use fictional patient data only. Login and consent controls are demo-level, not production security.</div>`)}`}
else if(page==='Patients'){let a=await api('/patients');$('#content').innerHTML=`<div class="welcome"><div><h2>Patients</h2><p class="muted">Unique Health ID patient directory.</p></div><button id="add">+ Register patient</button></div>${box('Patient register',tbl(['Health ID','Name','DOB','Gender','Phone','Email','Blood group','Action'],a.map(p=>tr([esc(p.health_id),esc(p.full_name),esc(p.date_of_birth),esc(p.gender),esc(p.phone),esc(p.email),esc(p.blood_group),`<button class="danger delete" data-id="${p.patient_id}">Delete</button>`]))))}`;$('#add').onclick=()=>formModal('Register patient',field('Health ID','health_id','text',true)+field('Full name','full_name','text',true)+field('Date of birth','date_of_birth','date')+field('Gender','gender')+field('Phone','phone')+field('Email','email','email')+field('Address','address')+field('Blood group','blood_group'),b=>api('/patients',{method:'POST',body:JSON.stringify(b)}));document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(confirm('Delete patient?'))try{await api('/patients/'+b.dataset.id,{method:'DELETE'});render()}catch(e){toast(e.message)}})}
else if(page==='Doctors'){let a=await api('/doctors');$('#content').innerHTML=`<div class="welcome"><div><h2>Doctors</h2><p class="muted">Doctor directory and specializations.</p></div><button id="add">+ Add doctor</button></div>${box('Doctor directory',tbl(['Name','Specialization','Department','Phone','Email','Fee'],a.map(d=>tr([esc(d.full_name),esc(d.specialization),esc(d.department),esc(d.phone),esc(d.email),esc(d.consultation_fee)]))))}`;$('#add').onclick=()=>formModal('Add doctor',field('Full name','full_name','text',true)+field('Specialization','specialization')+field('Department','department')+field('Phone','phone')+field('Email','email','email')+field('Consultation fee','consultation_fee','number'),b=>api('/doctors',{method:'POST',body:JSON.stringify(b)}))}
else if(page==='Appointments'){let [a,p,d]=await Promise.all([api('/appointments'),api('/patients'),api('/doctors')]);$('#content').innerHTML=`<div class="welcome"><div><h2>Appointments</h2><p class="muted">Schedule a visit using patient and doctor IDs.</p></div><button id="add">+ Schedule</button></div>${p.length&&d.length?'':`<p class="notice">Create a patient and doctor first. Their IDs are visible in MySQL tables.</p>`}${box('Appointment schedule',tbl(['Patient','Doctor','Date/time','Reason','Status'],a.map(x=>tr([esc(x.patient_name),esc(x.doctor_name),esc(dt(x.appointment_date)),esc(x.reason),esc(x.status)]))))}`;$('#add').onclick=()=>formModal('Schedule appointment',field('Patient ID','patient_id','number',true)+field('Doctor ID','doctor_id','number',true)+field('Date and time','appointment_date','datetime-local',true)+field('Reason','reason'),b=>{b.appointment_date=b.appointment_date.replace('T',' ')+':00';return api('/appointments',{method:'POST',body:JSON.stringify(b)})})}
else if(page==='Records'){let a=await api('/records');$('#content').innerHTML=`<div class="welcome"><div><h2>Medical records</h2><p class="muted">Clinical notes and patient history.</p></div><button id="add">+ Add record</button></div>${box('Health timeline',tbl(['Patient','Date','Diagnosis','Category','Hospital','Doctor'],a.map(x=>tr([esc(x.patient_name),esc(x.record_date),esc(x.diagnosis),esc(x.record_category),esc(x.hospital_name),esc(x.doctor_name)]))))}`;$('#add').onclick=()=>formModal('Add record',field('Patient ID','patient_id','number',true)+field('Doctor ID','doctor_id','number')+field('Date','record_date','date',true)+field('Diagnosis','diagnosis','text',true)+field('Category','record_category')+field('Hospital','hospital_name','text',true)+field('Notes','notes'),b=>api('/records',{method:'POST',body:JSON.stringify(b)}))}
else if(page==='Medicines'){let a=await api('/medicines');$('#content').innerHTML=`<h2>Pharmacy inventory</h2>${box('Medicines',tbl(['Name','Category','Stock','Unit price','Expiry'],a.map(x=>tr([esc(x.name),esc(x.category),esc(x.stock_quantity),esc(x.unit_price),esc(x.expiry_date)]))))}`}
else if(page==='Admissions'){let a=await api('/admissions');$('#content').innerHTML=`<h2>Admissions</h2>${box('Admission register',tbl(['Patient','Bed','Admitted','Discharged','Status'],a.map(x=>tr([esc(x.patient_name),esc(x.bed_number),esc(dt(x.admission_date)),esc(dt(x.discharge_date),),esc(x.status)]))))}`}
else if(page==='Bills'){let a=await api('/bills');$('#content').innerHTML=`<h2>Billing</h2>${box('Bills',tbl(['Patient','Date','Total','Paid','Status','Description'],a.map(x=>tr([esc(x.patient_name),esc(x.bill_date),esc(x.total_amount),esc(x.paid_amount),esc(x.payment_status),esc(x.description)]))))}`}
else if(page==='Consents'){let a=await api('/consents');$('#content').innerHTML=`<h2>Inter-hospital record sharing</h2><div class="notice">This demo records consent and revocation; it does not provide production-grade identity verification or enforce consent across every medical-record access.</div>${box('Consent register',tbl(['Patient ID','Health ID','Receiving hospital','Scope','Expiry','Status'],a.map(x=>tr([esc(x.patient_id),esc(x.health_id),esc(x.requesting_hospital),esc(x.record_scope),esc(dt(x.expires_at)),esc(x.status)]))))}`}
else if(page==='Audit'){let a=await api('/audit-logs');$('#content').innerHTML=`<h2>Audit log</h2>${box('Recent actions',tbl(['Time','Actor','Action','Entity','ID','Details'],a.map(x=>tr([esc(dt(x.created_at)),esc(x.actor),esc(x.action),esc(x.entity_type),esc(x.entity_id),esc(x.details)]))))}
}catch(e){$('#content').innerHTML=`<section class="panel"><h3>Could not load ${esc(page)}</h3><p>${esc(e.message)}</p><div class="error">Check that Spring Boot is running and MySQL schema is installed.</div><button id="retry" style="margin-top:12px">Retry</button></section>`;$('#retry').onclick=render}}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;render()});
$('#role').onchange=()=>{let x={admin:['admin@carelink.in','admin123'],doctor:['doctor@carelink.in','doctor123'],patient:['patient@carelink.in','patient123']}[$('#role').value];$('#email').value=x[0];$('#password').value=x[1]};
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{user=await api('/auth/login',{method:'POST',body:JSON.stringify({role:$('#role').value,email:$('#email').value,password:$('#password').value})});$('#who').textContent=user.name;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#apiStatus').textContent='● Java API connected';page='Dashboard';render()}catch(err){toast(err.message)}};
$('#logout').onclick=()=>{$('#app').classList.add('hidden');$('#login').classList.remove('hidden')};
</script></body></html>
